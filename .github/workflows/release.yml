name: Release General

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and upload release tarball
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Installing dependencies ...
        run: |
          sudo apt-get -y install tree tshark valgrind
      - name: Creating Makefiles ...
        run: |
          ./autogen.sh
          ./configure --prefix=/tmp --with-systemd=/tmp/lib/systemd/system
      - name: Enable unprivileged userns (unshare)
        run: |
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build release ...
        # DEBUG=1 keeps per-test dirs from being wiped on exit and folds
        # the syslogd -d trace into each test/<name>.log, so a test failure
        # during distcheck is traceable instead of a bare non-zero exit.
        env:
          DEBUG: 1
        run: |
          make release || {
            echo "::group::test-suite.log"
            find . -name test-suite.log | sort | xargs -r tail -n +1
            echo "::endgroup::"
            echo "::group::per-test step logs"
            find . -path '*/test/*.log' | sort | xargs -r tail -n +1
            echo "::endgroup::"
            echo "::group::syslogd debug logs"
            find /tmp/sysklogd -name '*.log' | sort | xargs -r tail -n +1
            echo "::endgroup::"
            false
          }
          mkdir -p artifacts/
          mv ../*.tar.* artifacts/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-test-logs
          path: |
            **/test/*.log
            **/test-suite.log
            /tmp/sysklogd/**/*.log
          if-no-files-found: ignore
      - name: Extract ChangeLog entry ...
        run: |
          awk '/-----*/{if (x == 1) exit; x=1;next}x' ChangeLog.md \
              |head -n -1 > release.md
          cat release.md
      - uses: ncipollo/release-action@v1
        with:
          name: sysklogd ${{ github.ref_name }}
          bodyFile: "release.md"
          artifacts: "artifacts/*"
